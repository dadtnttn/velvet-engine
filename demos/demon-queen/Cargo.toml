[package]
name = "demon-queen"
default-run = "demon-queen"
description = "Demon Queen - VN 18+ driven by an importable, versioned JSON story"
# The game's own version (SemVer), apart from the engine's: 0.2.0 = the prologue + act 1 build.
version = "0.2.0+fix1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
authors = ["Velvet Weaver"]
# The GPU HUD lives in src/overlay/ (part of the shared exploration scene, not binaries);
# src/bin/ holds only the extra binaries.
autobins = false

[features]
default = []
portable = ["demon-queen-dungeon/portable"]
console = []

[[bin]]
name = "demon-queen"
path = "src/main.rs"

[[bin]]
name = "demon-queen-3d"
path = "src/bin/3d_preview.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
rustybuzz = "0.20"
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
unicode-segmentation = "1.12"
winit = { workspace = true }
velvet-style = { workspace = true }
velvet-ui = { workspace = true }
velvet-math = { workspace = true }
velvet-render = { workspace = true }
# AVIF pictures and AV1 clips of the release (rav1d, pure Rust).
velvet-avif = { path = "../../crates/velvet-avif" }
velvet-image = { workspace = true }
velvet-dungeon = { path = "../../crates/velvet-dungeon" }
velvet-nav = { workspace = true }
velvet-guion = { workspace = true }
velvet-qa = { workspace = true }
demon-queen-dungeon = { path = "dungeon" }
demon-queen-war = { path = "war" }
# Its music is OGG (Vorbis) and its sounds WAV: not the workspace's rodio, which brings every
# decoder (MP3, FLAC, MP4/AAC) by default.
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "wav"] }

[[bin]]
name = "dungeon-lab"
path = "src/bin/dungeon_lab.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Memory"] }
# The scenes' clips are videos decoded by Media Foundation (src/clip_video.rs).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
