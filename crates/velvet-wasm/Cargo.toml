[package]
name = "velvet-wasm"
description = "Velvet crates compiled to WebAssembly for Velvet JS (velvet-guion, velvet-stacks)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
velvet-guion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.126"
