[package]
name = "velvet-wasm"
description = "Velvet crates compiled to WebAssembly for Velvet JS (velvet-guion, velvet-stacks)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
velvet-guion = { workspace = true, features = ["vs3"] }
velvet-stacks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.126"

# Velvet Script 3 (the guiones' logic files) links a cipher that needs randomness; in the browser
# it comes from `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
