[package]
name = "velvet-cli"
description = "Velvet Engine command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "velvet"
path = "src/main.rs"

[dependencies]
velvet-core = { workspace = true }
velvet-app = { workspace = true, features = ["window"] }
velvet-project = { workspace = true }
velvet-script-parser = { workspace = true }
velvet-script-compiler = { workspace = true }
velvet-script-vm = { workspace = true }
velvet-script-vs3 = { workspace = true }
velvet-script-vs3-engine = { workspace = true }
velvet-vs3-app = { workspace = true }
velvet-script-format = { workspace = true }
velvet-script-lsp = { workspace = true }
velvet-story-lang = { workspace = true }
velvet-document = { workspace = true }
velvet-story = { workspace = true }
velvet-scene3d = { workspace = true }
velvet-terrain = { workspace = true }
velvet-cards = { workspace = true }
velvet-style = { workspace = true }
velvet-image = { workspace = true }
velvet-artbuild = { workspace = true }
velvet-crypto = { workspace = true }
velvet-audio = { workspace = true }
velvet-build = { workspace = true }
velvet-vlz = { workspace = true }
velvet-desktop = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
camino = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
walkdir = { workspace = true }
softbuffer = { workspace = true }
winit = { workspace = true }
# The release's packaging (src/js_build_cmd.rs): the icon's sizes and PNG bytes, the SHA256SUMS file,
# the release archive. Workspace versions, so the locked ones.
image = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }

# Writes the program's icon into its resources (src/js_build_cmd.rs). The locked version, with the
# functions it calls only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["window"]
window = ["velvet-app/window"]
