[package]
name = "velvet-avif"
description = "AV1 decoding for Velvet Engine: AVIF pictures and AV1 clips (IVF), on rav1d (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
avif-parse = "1"
image = { version = "0.25", default-features = false }

# rav1d's assembly (nasm) on desktop x86 only. Its ARM assembly cannot build from the crates.io
# package (1.1.0 leaves out every `.h`, src/arm/asm-offsets.h among them), and its x86 assembly
# cannot link into a shared library (PC32 relocations against Rust symbols), which is what an
# Android app is. ARM and Android targets decode with the Rust code alone.
[target.'cfg(all(any(target_arch = "x86", target_arch = "x86_64"), not(target_os = "android")))'.dependencies]
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }

[target.'cfg(not(all(any(target_arch = "x86", target_arch = "x86_64"), not(target_os = "android"))))'.dependencies]
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[features]
# rav1d's NEON assembly on 64-bit ARM (several times faster decoding on phones). For aarch64
# builds only (`velvet android`'s `abi_cargo_features` for arm64-v8a): on x86_64 Android it would
# add rav1d's x86 assembly, which cannot link into a shared library. It also needs rav1d's own
# source, which has the headers the crates.io package leaves out: a workspace that turns it on
# patches rav1d with its git tag, e.g.
# `[patch.crates-io] rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0" }`.
arm-asm = ["rav1d/asm", "rav1d/asm_arm64_dotprod", "rav1d/asm_arm64_i8mm", "rav1d/asm_arm64_sve2"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
