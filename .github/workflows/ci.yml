name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check / Test / Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode-velvet/pnpm-lock.yaml

      - name: System deps (Linux)
        run: |
          sudo apt-get update
          # nasm: rav1d (velvet-avif) builds its x86 assembly with it
          sudo apt-get install -y libasound2-dev libudev-dev nasm

      - name: Test quality
        run: python3 tools/check_test_quality.py

      - name: Repository contents
        run: python3 tools/check_repository.py

      - name: VS3 boundaries
        run: python3 tools/check_vs3_boundaries.py

      - name: Check VS Code extension
        working-directory: editors/vscode-velvet
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: |
          cargo check --workspace --all-targets --all-features --exclude demon-queen --exclude demon-queen-dungeon

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --exclude demon-queen --exclude demon-queen-dungeon -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features --exclude demon-queen --exclude demon-queen-dungeon

      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --exclude demon-queen --exclude demon-queen-dungeon
        env:
          RUSTDOCFLAGS: "-D warnings"
